name: Security & Quality Gate (SAST)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep cyclonedx-bom

      - name: Run Bandit (Quality Gate)
        run: |
          # Fails (-lll -iii) if issues with HIGH severity and HIGH confidence are detected
          bandit -r ./src -lll -iii

      - name: Run Semgrep
        run: |
          semgrep --config auto ./src --error

      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py environment -o docs/sbom_environment.json